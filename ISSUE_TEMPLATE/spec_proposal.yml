name: Spec proposal
description: A worked-through proposal for new behaviour, ready to discuss and build against.
labels: [spec]
body:
  - type: markdown
    attributes:
      value: |
        Use this when you've thought through how something should behave. A good spec is something a person or an agent could build against without guessing. Keep it as short as the change allows.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome does this deliver, and for whom?
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Behaviour
      description: How it should work. Given/When/Then scenarios are welcome but not required.
      placeholder: |
        Given ...
        When ...
        Then ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this deliberately doesn't cover.
  - type: dropdown
    id: risk
    attributes:
      label: Rough risk
      description: How much could this break, or how hard would it be to undo?
      options:
        - Low
        - Medium
        - High
        - Not sure
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Open questions
